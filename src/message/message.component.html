<div class="notification-message-wrapper">

  @for (message of messageService.messages$ | async; track message) {
    <ng-container [ngTemplateOutlet]="notificationMessage" [ngTemplateOutletContext]="{ message: message }"></ng-container>
  }

</div>

<ng-template #notificationMessage let-message="message">

  <div class="message">
    <div class="message-wrapper">
      <div class="message-info-container">
        <fa-icon [icon]="faEnvelope" />
        <div class="message-title">
          <span class="fs-18 fw-700 lh-20px">{{ message.type }}</span>
          <span class="fs-16 fw-400 lh-20px">{{ message.text }}</span>
        </div>
      </div>
      <div class="close-message-wrapper">
        <button [id]="'close-' + message.text" class="close-message" (click)="messageService.closeMessage(message)">
          <fa-icon [icon]="faCloseMark" />
        </button>
      </div>
    </div>
  </div>
  
</ng-template>
